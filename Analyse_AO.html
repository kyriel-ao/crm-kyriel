<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Analyse AO — CRM Kyriel</title>
<script src="msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0ec;color:#1a1a18;font-size:13px;}
.topbar{background:#185FA5;padding:0 16px;display:flex;align-items:center;gap:12px;height:46px;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:600;color:#fff;}
.topbar-links{display:flex;gap:6px;margin-left:auto;}
.topbar-link{font-size:11px;color:rgba(255,255,255,.85);text-decoration:none;padding:4px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.3);}
.topbar-link:hover{background:rgba(255,255,255,.15);}
.topbar-user{font-size:11px;color:rgba(255,255,255,.7);}
.topbar-logout{font-size:11px;color:rgba(255,255,255,.7);cursor:pointer;text-decoration:underline;}

.auth-screen{display:flex;align-items:center;justify-content:center;height:calc(100vh - 46px);}
.auth-card{background:#fff;border-radius:12px;padding:36px 44px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:380px;}
.auth-card .ico{font-size:40px;margin-bottom:14px;}
.auth-card h2{font-size:18px;font-weight:600;margin-bottom:8px;}
.auth-card p{font-size:13px;color:#666;margin-bottom:22px;line-height:1.6;}
.btn-login{background:#185FA5;color:#fff;border:none;padding:11px 30px;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;}

.main{display:flex;flex-direction:column;height:calc(100vh - 46px);overflow:hidden;}

/* Onglets entité */
.entity-tabs{background:#fff;border-bottom:2px solid #e8e8e0;padding:0 14px;display:flex;gap:0;flex-shrink:0;}
.etab{padding:9px 22px;font-size:12px;font-weight:500;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s;}
.etab:hover{color:#444;}
.etab.kc.active{color:#1D9E75;border-bottom-color:#1D9E75;font-weight:600;}
.etab.kr.active{color:#D85A30;border-bottom-color:#D85A30;font-weight:600;}
.etab.ka.active{color:#BA7517;border-bottom-color:#BA7517;font-weight:600;}
.etab.groupe.active{color:#185FA5;border-bottom-color:#185FA5;font-weight:600;}

/* Toolbar */
.toolbar{background:#fff;border-bottom:1px solid #ddd;padding:7px 14px;display:flex;gap:10px;align-items:center;flex-shrink:0;}
.btn{font-size:11px;padding:5px 12px;border:1px solid #ddd;border-radius:5px;background:#fff;cursor:pointer;color:#444;}
.btn:hover{background:#f5f5f0;}
.btn.primary{background:#185FA5;color:#fff;border-color:#185FA5;}
.period-label{font-size:12px;font-weight:500;color:#444;}
.period-nav{font-size:16px;padding:2px 10px;border:1px solid #ddd;border-radius:5px;background:#fff;cursor:pointer;}
.period-nav:hover{background:#f5f5f0;}

/* Contenu scrollable */
.content{flex:1;overflow-y:auto;padding:14px;}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
.kpi{background:#fff;border:1px solid #e8e8e0;border-radius:8px;padding:10px 14px;}
.kpi .lbl{font-size:10px;color:#888;margin-bottom:3px;}
.kpi .val{font-size:20px;font-weight:600;}
.kpi .sub{font-size:10px;color:#aaa;margin-top:1px;}
.green{color:#1D9E75;}.red{color:#C0392B;}.blue{color:#185FA5;}.orange{color:#BA7517;}.purple{color:#534AB7;}

/* Cards */
.card{background:#fff;border:1px solid #e8e8e0;border-radius:9px;padding:14px;margin-bottom:12px;}
.card-title{font-size:12px;font-weight:600;color:#444;margin-bottom:10px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}

/* Barres */
.bar-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.bar-lbl{font-size:11px;color:#555;width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-lbl.wide{width:160px;}
.bar-track{flex:1;background:#eee;border-radius:3px;height:14px;overflow:hidden;display:flex;}
.bar-seg{height:100%;}
.bar-num{font-size:11px;color:#666;width:30px;text-align:right;flex-shrink:0;}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#555;margin-bottom:8px;}
.leg span{display:flex;align-items:center;gap:4px;}
.dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

/* Gauge cibles */
.gauge-wrap{position:relative;height:16px;background:#eee;border-radius:8px;overflow:hidden;margin-bottom:3px;}
.gauge-fill{height:100%;border-radius:8px;transition:width .4s;}
.gauge-target{position:absolute;top:0;bottom:0;width:2px;background:#333;opacity:.5;}
.gauge-lbl{display:flex;justify-content:space-between;font-size:10px;color:#888;margin-bottom:8px;}

/* Sliders */
.slider-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.sl-item .sl-lbl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
.sl-item input[type=range]{width:100%;accent-color:#185FA5;}

/* Score */
.score-banner{background:#fff;border:1px solid #e8e8e0;border-radius:9px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:20px;}
.score-big{font-size:36px;font-weight:700;}
.score-stars{font-size:20px;letter-spacing:2px;}

/* Verdict */
.vok{color:#1D9E75;font-weight:500;font-size:12px;margin-bottom:6px;}
.vwarn{color:#BA7517;font-weight:500;font-size:12px;margin-bottom:6px;}
.vko{color:#C0392B;font-weight:500;font-size:12px;margin-bottom:6px;}

/* Badges */
.badge{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:600;white-space:nowrap;display:inline-block;}
.bpub{background:#ddeaf8;color:#0c447c;}.bpriv{background:#fae5de;color:#8a2e10;}
.bmex{background:#dff2ea;color:#075038;}.bmin{background:#eeedfe;color:#3c3489;}
.bboth{background:#fdefd6;color:#5c3200;}
.dep-chip{font-size:9px;background:#f0f0ec;border:1px solid #ddd;border-radius:4px;padding:1px 5px;color:#444;}

/* Table CODIR */
.tbl-wrap{max-height:350px;overflow-y:auto;border:1px solid #eee;border-radius:6px;}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{font-size:10px;font-weight:600;color:#666;text-align:left;padding:5px 8px;border-bottom:1px solid #eee;background:#fafaf8;position:sticky;top:0;}
td{padding:4px 8px;border-bottom:1px solid #f0f0ec;}
tr:hover td{background:#f9f9f5;}

/* Export */
.export-btn{font-size:11px;padding:5px 12px;border:1px solid #ddd;border-radius:5px;background:#fff;cursor:pointer;margin-bottom:10px;}

.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:#888;}
.spinner{width:18px;height:18px;border:2px solid #e0e0e0;border-top-color:#185FA5;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{position:fixed;bottom:20px;right:20px;background:#1a1a18;color:#fff;padding:10px 18px;border-radius:7px;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}.toast.success{background:#1D9E75;}.toast.error{background:#C0392B;}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">📈 Analyse AO</span>
  <div class="topbar-links">
    <a class="topbar-link" href="Planning_KC.html">📅 KC</a>
    <a class="topbar-link" href="Planning_KR.html">📅 KR</a>
    <a class="topbar-link" href="Planning_KA.html">📅 KA</a>
    <a class="topbar-link" href="Index.html">🏠 Accueil</a>
  </div>
  <span class="topbar-user" id="user-name"></span>
  <span class="topbar-logout" onclick="logout()">Déconnexion</span>
</div>

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="ico">📈</div>
    <h2>Analyse AO — Groupe Kyriel</h2>
    <p>Connectez-vous avec votre compte Microsoft pour accéder à l'analyse.</p>
    <button class="btn-login" onclick="doLogin()">Se connecter avec Microsoft</button>
  </div>
</div>

<div id="main-screen" class="main" style="display:none;">
  <!-- Onglets entité -->
  <div class="entity-tabs">
    <div class="etab kc active" onclick="switchEntity('KC',this)">🏗 KC — Construction</div>
    <div class="etab kr" onclick="switchEntity('KR',this)">🔨 KR — Réhabilitation</div>
    <div class="etab ka" onclick="switchEntity('KA',this)">🪟 KA — Aluminium</div>
    <div class="etab groupe" onclick="switchEntity('GROUPE',this)">🌐 Groupe consolidé</div>
  </div>

  <!-- Toolbar période -->
  <div class="toolbar">
    <button class="period-nav" onclick="periodNav(-1)">‹</button>
    <span class="period-label" id="period-label"></span>
    <button class="period-nav" onclick="periodNav(1)">›</button>
    <button class="btn" onclick="resetPeriod()">Période actuelle</button>
    <div style="width:1px;height:22px;background:#e0e0e0;"></div>
    <button class="btn" onclick="loadAll()">↻ Actualiser</button>
    <span id="data-count" style="font-size:11px;color:#888;margin-left:4px;"></span>
  </div>

  <div class="content" id="content">
    <div class="loading"><div class="spinner"></div>Connexion à SharePoint...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── AUTH ──────────────────────────────────────────────────────────
const CLIENT_ID='a14d6f8e-d723-42de-b1c6-e5892e092157',TENANT_ID='b361cb3e-b7d9-4ea0-84c7-ccc513daffd6',SITE_NAME='CRMKyrielAO';
const AUTHORITY='https://login.microsoftonline.com/'+TENANT_ID;
const SCOPES=['https://hmsarl.sharepoint.com/.default'];
let msalApp=null,currentAccount=null;

async function initMSAL(){
  msalApp=new msal.PublicClientApplication({
    auth:{clientId:CLIENT_ID,authority:AUTHORITY,redirectUri:'https://kyriel-ao.github.io/crm-kyriel/'+window.location.pathname.split('/').pop()},
    cache:{cacheLocation:'sessionStorage'},system:{allowNativeBroker:false,windowHashTimeout:9000,iframeHashTimeout:9000,loadFrameTimeout:9000}
  });
  await msalApp.initialize();
  const resp=await msalApp.handleRedirectPromise();
  if(resp)currentAccount=resp.account;
  const accs=msalApp.getAllAccounts();
  if(accs.length>0&&!currentAccount)currentAccount=accs[0];
}
async function login(){
  try{const r=await msalApp.loginPopup({scopes:SCOPES});currentAccount=r.account;return true;}
  catch(e){return false;}
}
async function getToken(){
  if(!currentAccount)return null;
  try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:currentAccount});return r.accessToken;}
  catch(e){try{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});return r.accessToken;}catch(e2){return null;}}
}
async function spGetList(listName){
  const token=await getToken();
  const url='https://hmsarl.sharepoint.com/sites/'+SITE_NAME+'/_api/lists/getbytitle(\''+listName+'\''+')/items?$top=5000&$orderby=DateRemise%20asc';
  const r=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Accept':'application/json;odata=verbose'}});
  if(!r.ok)return[];
  const d=await r.json();return d.d.results;
}
function logout(){msalApp.logoutPopup();location.reload();}

// ── ÉTAT ──────────────────────────────────────────────────────────
let currentEntity='KC';
let periodOffset=0; // 0 = mois courant
let allDataByList={KC:[],KR:[],KA:[]};
let T1=50,T2=50,T3=20,TOL1=10,TOL2=15,TOL3=10;

// ── INIT ──────────────────────────────────────────────────────────
window.addEventListener('load',async()=>{
  await initMSAL();
  if(msalApp.getAllAccounts().length>0){
    currentAccount=msalApp.getAllAccounts()[0];
    showMain();
  }
});

async function doLogin(){const ok=await login();if(ok)showMain();else showToast('Erreur connexion','error');}

async function showMain(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('main-screen').style.display='flex';
  document.getElementById('user-name').textContent=currentAccount?.name||currentAccount?.username||'';
  await loadAll();
}

async function loadAll(){
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Chargement des données...</div>';
  try{
    const [kc,kr,ka]=await Promise.all([
      spGetList('Planning_KC'),
      spGetList('Planning_KR'),
      spGetList('Planning_KA')
    ]);
    allDataByList.KC=kc.map(mapItem);
    allDataByList.KR=kr.map(mapItem);
    allDataByList.KA=ka.map(mapItem);
    render();
  }catch(e){
    console.error(e);
    allDataByList={KC:[],KR:[],KA:[]};
    render();
    showToast('Erreur chargement SharePoint','error');
  }
}

function mapItem(r){
  const d=r.DateRemise?new Date(r.DateRemise):null;
  return{
    entite:r.Entite||'',pubPriv:r.PubPriv||'',typeMOA:r.TypeMOA||'',
    typeProjet:r.TypeProjet||'',env:r.Env||'',lot:r.Lot||'',
    client:r.Client||'',nom:r.NomOperation||'',ville:r.Ville||'',
    dep:r.Departement||'',region:r.Region||'',
    ca:r.ChargeAffaire||'',metreur:r.Metreur||'',
    statut:r.Statut||'',montant:+r.MontantEstime||0,note:r.Note||'',
    date:d,day:d?d.getDate():0,month:d?d.getMonth()+1:0,year:d?d.getFullYear():0,
    label: (r.PubPriv||'')+(r.Ville?' - '+r.Ville:'')+(r.Client?' - '+r.Client:'')+(r.NomOperation?' - '+r.NomOperation:''),
  };
}

// ── NAVIGATION ────────────────────────────────────────────────────
function switchEntity(ent,btn){
  currentEntity=ent;
  document.querySelectorAll('.etab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function periodNav(d){periodOffset+=d;render();}
function resetPeriod(){periodOffset=0;render();}

function getPeriodMonths(){
  const now=new Date();
  const months=[];
  for(let i=0;i<3;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+periodOffset+i,1);
    months.push({year:d.getFullYear(),month:d.getMonth()+1});
  }
  return months;
}

const MOIS=['','Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const MOIS_LONG=['','Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function getPeriodLabel(){
  const ms=getPeriodMonths();
  return MOIS_LONG[ms[0].month]+' '+ms[0].year+' → '+MOIS_LONG[ms[2].month]+' '+ms[2].year;
}

function getDataForEntity(){
  if(currentEntity==='GROUPE') return[...allDataByList.KC,...allDataByList.KR,...allDataByList.KA];
  return allDataByList[currentEntity]||[];
}

function filterByPeriod(data){
  const ms=getPeriodMonths();
  return data.filter(r=>ms.some(m=>r.year===m.year&&r.month===m.month));
}

// ── RENDER PRINCIPAL ──────────────────────────────────────────────
function render(){
  document.getElementById('period-label').textContent=getPeriodLabel();
  const allData=getDataForEntity();
  const data=filterByPeriod(allData);
  document.getElementById('data-count').textContent=data.length+' AO sur la période';

  const content=document.getElementById('content');

  if(!data.length){
    content.innerHTML=
      '<div style="text-align:center;padding:60px;color:#888;">'+
        '<div style="font-size:36px;margin-bottom:12px;">📭</div>'+
        '<div style="font-size:14px;font-weight:500;">Aucun AO sur cette période</div>'+
        '<div style="font-size:12px;margin-top:6px;">Ajoutez des AO depuis les plannings ou naviguez sur une autre période.</div>'+
      '</div>';
    return;
  }

  // Calculs
  const nPUB=data.filter(r=>r.pubPriv==='PUB').length;
  const nPRIV=data.filter(r=>r.pubPriv==='PRIV').length;
  const TERT_KW=['bureau','siege','tertiaire','chaufferie','salle de sport','tribunes','lycee','ehpad','hopital','chu','ecole','mairie','alsh','prison','industriel','hotel'];
  function isT(r){const t=(r.typeProjet||r.nom||'').toLowerCase();return TERT_KW.some(k=>t.includes(k));}
  const nLog=data.filter(r=>!isT(r)).length;
  const nTert=data.length-nLog;
  function isDev(r){return['33','91','75','78','92','93','94','50','76','28'].includes(r.dep)||r.region==='Île-de-France'||r.region==='Nouvelle-Aquitaine';}
  const nDev=data.filter(isDev).length;

  // Par type de lot
  const lotC={MEX:0,MIN:0,'MEX+MIN':0,Autre:0};
  data.forEach(r=>{
    const l=r.lot||'';
    const m=l.includes('MEX'),n=l.includes('MIN');
    if(m&&n)lotC['MEX+MIN']++;else if(m)lotC.MEX++;else if(n)lotC.MIN++;else lotC.Autre++;
  });

  // Par département
  const depC={};
  data.forEach(r=>{if(r.dep)depC[r.dep]=(depC[r.dep]||0)+1;});
  const topDep=Object.entries(depC).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxDep=topDep[0]?topDep[0][1]:1;

  // Par promoteur/client
  const promoC={};
  data.forEach(r=>{if(r.client)promoC[r.client]=(promoC[r.client]||0)+1;});
  const topPromo=Object.entries(promoC).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxPromo=topPromo[0]?topPromo[0][1]:1;

  // Par mois
  const ms=getPeriodMonths();
  const byMonth=ms.map(m=>{
    const d=data.filter(r=>r.year===m.year&&r.month===m.month);
    return{label:MOIS[m.month]+' '+m.year,n:d.length,pub:d.filter(r=>r.pubPriv==='PUB').length};
  });
  const maxMonth=Math.max(1,...byMonth.map(m=>m.n));

  // Par entité (si groupe)
  const entityC={};
  if(currentEntity==='GROUPE'){
    ['KC','KR','KA'].forEach(e=>{
      const d=filterByPeriod(allDataByList[e]);
      entityC[e]=d.length;
    });
  }

  // Cibles
  const pPUB=Math.round(nPUB/data.length*100);
  const pLog=Math.round(nLog/data.length*100);
  const pDev=Math.round(nDev/data.length*100);
  function sc(v,t,tol){const d=Math.abs(v-t);return d<=tol?1:d<=tol*2?0.5:0;}
  const s1=sc(pPUB,T1,TOL1),s2=sc(pLog,T2,TOL2),s3=sc(pDev,T3,TOL3);
  const score=Math.round((s1+s2+s3)/3*100);
  const sColor=score>=70?'#1D9E75':score>=40?'#BA7517':'#C0392B';

  // ── HTML ──────────────────────────────────────────────────────
  let html='';

  // KPIs
  html+=`<div class="kpi-grid">
    ${kpi('Dossiers',data.length,'période en cours','blue')}
    ${kpi('Public',nPUB,Math.round(nPUB/data.length*100)+'%','blue')}
    ${kpi('Privé',nPRIV,Math.round(nPRIV/data.length*100)+'%','orange')}
    ${kpi('MEX',lotC.MEX+'+'+lotC['MEX+MIN'],'seul + combiné','green')}
    ${kpi('MIN',lotC.MIN+'+'+lotC['MEX+MIN'],'seul + combiné','purple')}
  </div>`;

  // Répartition par mois + par lot
  html+='<div class="two-col">';

  // Par mois
  html+='<div class="card"><div class="card-title">AO par mois</div>';
  html+='<div class="leg"><span><span class="dot" style="background:#185FA5;"></span>PUB</span><span><span class="dot" style="background:#D85A30;"></span>PRIV</span></div>';
  byMonth.forEach(m=>{
    const wP=Math.round(m.pub/maxMonth*100);
    const wPr=Math.round((m.n-m.pub)/maxMonth*100);
    html+=`<div class="bar-row">
      <div class="bar-lbl">${m.label}</div>
      <div class="bar-track">
        <div class="bar-seg" style="width:${wP}%;background:#185FA5;opacity:.8;"></div>
        <div class="bar-seg" style="width:${wPr}%;background:#D85A30;opacity:.8;"></div>
      </div>
      <div class="bar-num">${m.n}</div>
    </div>`;
  });
  html+='</div>';

  // Par lot
  html+='<div class="card"><div class="card-title">Répartition des lots</div>';
  html+='<div class="leg"><span><span class="dot" style="background:#1D9E75;"></span>MEX</span><span><span class="dot" style="background:#534AB7;"></span>MIN</span><span><span class="dot" style="background:#BA7517;"></span>MEX+MIN</span></div>';
  [['MEX','#1D9E75'],['MIN','#534AB7'],['MEX+MIN','#BA7517'],['Autre','#aaa']].forEach(([k,c])=>{
    if(!lotC[k])return;
    const w=Math.round(lotC[k]/data.length*100);
    html+=`<div class="bar-row">
      <div class="bar-lbl">${k}</div>
      <div class="bar-track"><div class="bar-seg" style="width:${w}%;background:${c};opacity:.85;"></div></div>
      <div class="bar-num">${lotC[k]}</div>
    </div>`;
  });

  if(currentEntity==='GROUPE'){
    html+='<div style="margin-top:12px;padding-top:10px;border-top:1px solid #eee;"><div class="card-title" style="margin-bottom:8px;">Par entité</div>';
    [['KC','#1D9E75'],['KR','#D85A30'],['KA','#BA7517']].forEach(([e,c])=>{
      const n=entityC[e]||0;
      const w=Math.round(n/data.length*100);
      html+=`<div class="bar-row">
        <div class="bar-lbl">${e}</div>
        <div class="bar-track"><div class="bar-seg" style="width:${w}%;background:${c};opacity:.85;"></div></div>
        <div class="bar-num">${n}</div>
      </div>`;
    });
    html+='</div>';
  }
  html+='</div></div>';

  // Géographie + Promoteurs
  html+='<div class="two-col">';
  html+='<div class="card"><div class="card-title">Top départements</div>';
  html+='<div class="leg"><span><span class="dot" style="background:#1D9E75;"></span>MEX</span><span><span class="dot" style="background:#534AB7;"></span>MIN</span><span><span class="dot" style="background:#BA7517;"></span>MEX+MIN</span></div>';
  topDep.forEach(([dep,n])=>{
    const depData=data.filter(r=>r.dep===dep);
    const lc={MEX:0,MIN:0,'MEX+MIN':0};
    depData.forEach(r=>{const l=r.lot||'';const m=l.includes('MEX'),ni=l.includes('MIN');if(m&&ni)lc['MEX+MIN']++;else if(m)lc.MEX++;else if(ni)lc.MIN++;});
    const wM=Math.round(lc.MEX/maxDep*100),wN=Math.round(lc.MIN/maxDep*100),wB=Math.round(lc['MEX+MIN']/maxDep*100);
    html+=`<div class="bar-row">
      <div class="bar-lbl"><span class="dep-chip">${dep}</span> ${data.find(r=>r.dep===dep)?.ville||''}</div>
      <div class="bar-track">
        <div class="bar-seg" style="width:${wM}%;background:#1D9E75;opacity:.85;"></div>
        <div class="bar-seg" style="width:${wN}%;background:#534AB7;opacity:.85;"></div>
        <div class="bar-seg" style="width:${wB}%;background:#BA7517;opacity:.85;"></div>
      </div>
      <div class="bar-num">${n}</div>
    </div>`;
  });
  html+='</div>';

  html+='<div class="card"><div class="card-title">Top clients / MOA</div>';
  topPromo.forEach(([client,n])=>{
    const w=Math.round(n/maxPromo*100);
    const isPub=data.filter(r=>r.client===client).some(r=>r.pubPriv==='PUB');
    html+=`<div class="bar-row">
      <div class="bar-lbl wide" title="${client}">${client}</div>
      <div class="bar-track"><div class="bar-seg" style="width:${w}%;background:${isPub?'#185FA5':'#D85A30'};opacity:.8;"></div></div>
      <div class="bar-num">${n}</div>
    </div>`;
  });
  html+='</div></div>';

  // Cibles stratégiques
  html+=`<div class="score-banner">
    <div><div style="font-size:10px;color:#888;">Score global</div><div class="score-big" style="color:${sColor}">${score}%</div></div>
    <div><div style="font-size:10px;color:#888;">Alignement</div><div class="score-stars">${score>=70?'★★★':score>=40?'★★☆':'★☆☆'}</div></div>
    <div style="font-size:11px;color:#666;line-height:1.7;">${data.length} dossiers · ${getPeriodLabel()}<br>Cibles : PUB ${T1}% · Logement ${T2}% · Dév. territ. ${T3}%</div>
    <button class="btn" onclick="toggleCibles()" style="margin-left:auto;">⚙️ Ajuster les cibles</button>
  </div>`;

  html+=`<div id="cibles-sliders" style="display:none;" class="card">
    <div class="card-title">Ajuster les cibles stratégiques</div>
    <div class="slider-grid">
      <div class="sl-item">
        <div class="sl-lbl"><span>① Cible PUB</span><span id="v-t1" style="font-weight:600;color:#185FA5;">${T1}%</span></div>
        <input type="range" min="10" max="90" step="5" value="${T1}" oninput="T1=+this.value;document.getElementById('v-t1').textContent=this.value+'%';render();">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#aaa;"><span>PRIV</span><span>PUB</span></div>
        <div style="font-size:10px;color:#888;margin-top:4px;">Tolérance ±<input type="number" value="${TOL1}" min="5" max="25" step="5" style="width:36px;font-size:10px;padding:1px 4px;border:1px solid #ddd;border-radius:3px;" oninput="TOL1=+this.value||10;render();">%</div>
      </div>
      <div class="sl-item">
        <div class="sl-lbl"><span>② Cible Logement</span><span id="v-t2" style="font-weight:600;color:#1D9E75;">${T2}%</span></div>
        <input type="range" min="10" max="90" step="5" value="${T2}" oninput="T2=+this.value;document.getElementById('v-t2').textContent=this.value+'%';render();">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#aaa;"><span>Tertiaire</span><span>Logement</span></div>
        <div style="font-size:10px;color:#888;margin-top:4px;">Tolérance ±<input type="number" value="${TOL2}" min="5" max="25" step="5" style="width:36px;font-size:10px;padding:1px 4px;border:1px solid #ddd;border-radius:3px;" oninput="TOL2=+this.value||15;render();">%</div>
      </div>
      <div class="sl-item">
        <div class="sl-lbl"><span>③ Dév. territorial</span><span id="v-t3" style="font-weight:600;color:#BA7517;">${T3}%</span></div>
        <input type="range" min="0" max="50" step="5" value="${T3}" oninput="T3=+this.value;document.getElementById('v-t3').textContent=this.value+'%';render();">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#aaa;"><span>0%</span><span>50%</span></div>
        <div style="font-size:10px;color:#888;margin-top:4px;">Tolérance ±<input type="number" value="${TOL3}" min="5" max="20" step="5" style="width:36px;font-size:10px;padding:1px 4px;border:1px solid #ddd;border-radius:3px;" oninput="TOL3=+this.value||10;render();">%</div>
      </div>
    </div>
  </div>`;

  html+='<div class="two-col">';
  html+=cibleCard('① PUB / PRIV',pPUB,T1,'#185FA5',s1,'±'+TOL1+'%',nPUB+'pub / '+nPRIV+'priv');
  html+=cibleCard('② Logement / Tertiaire',pLog,T2,'#1D9E75',s2,'±'+TOL2+'%',nLog+'log / '+nTert+'tert');
  html+='</div>';
  html+=cibleCard('③ Développement territorial (IDF · Aquitaine · Finistère 29)',pDev,T3,'#BA7517',s3,'±'+TOL3+'%',nDev+' dossiers hors territoire historique',true);

  // Tableau CODIR
  html+=`<div class="card">
    <div class="card-title">Export CODIR — détail des ${data.length} dossiers</div>
    <button class="export-btn" onclick="exportCSV(${JSON.stringify(data).replace(/</g,'&lt;')})">⬇ Exporter CSV</button>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Entité</th><th>Mois</th><th>PUB/PRIV</th><th>Lot</th><th>Dép.</th><th>Ville</th><th>Client</th><th>Opération</th><th>CA</th><th>Statut</th></tr></thead>
        <tbody>
          ${data.map(r=>`<tr>
            <td>${r.entite}</td>
            <td>${r.month?MOIS[r.month]+' '+r.year:''}</td>
            <td><span class="badge ${r.pubPriv==='PUB'?'bpub':'bpriv'}">${r.pubPriv}</span></td>
            <td>${r.lot}</td>
            <td><span class="dep-chip">${r.dep}</span></td>
            <td>${r.ville}</td>
            <td>${r.client}</td>
            <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;">${r.nom}</td>
            <td>${r.ca}</td>
            <td>${r.statut}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  content.innerHTML=html;
}

function kpi(l,v,s,cls){
  return`<div class="kpi"><div class="lbl">${l}</div><div class="val ${cls||''}">${v}</div><div class="sub">${s}</div></div>`;
}

function cibleCard(title,pct,target,color,score,tolLabel,detail,full=false){
  const verd=score===1?`<div class="vok">✅ Dans la cible (${tolLabel})</div>`:
    score===0.5?`<div class="vwarn">⚠️ Légèrement hors cible (${Math.abs(pct-target)}% d'écart)</div>`:
    `<div class="vko">❌ Hors cible — ${Math.abs(pct-target)}% d'écart</div>`;
  return`<div class="card"${full?' style="grid-column:1/-1"':''}>
    <div class="card-title">${title}</div>
    <div class="gauge-wrap"><div class="gauge-fill" style="width:${Math.min(pct,100)}%;background:${color};"></div><div class="gauge-target" style="left:${target}%;"></div></div>
    <div class="gauge-lbl"><span>0%</span><span style="font-weight:500;color:#333;">Réel : ${pct}%</span><span>Cible : ${target}%</span><span>100%</span></div>
    <div style="font-size:11px;color:#555;margin-bottom:6px;">${detail}</div>
    ${verd}
  </div>`;
}

function toggleCibles(){
  const el=document.getElementById('cibles-sliders');
  el.style.display=el.style.display==='none'?'block':'none';
}

function exportCSV(data){
  const lines=['Entité;Mois;PUB/PRIV;Lot;Département;Ville;Client;Opération;CA;Métreur;Statut;Montant'];
  data.forEach(r=>lines.push([
    r.entite,r.month?MOIS[r.month]+' '+r.year:'',r.pubPriv,r.lot,r.dep,r.ville,
    r.client,'"'+r.nom+'"',r.ca,r.metreur,r.statut,r.montant
  ].join(';')));
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='Analyse_AO_Kyriel.csv';a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;
  setTimeout(()=>t.className='toast',3000);
}
</script>
</body>
</html>
