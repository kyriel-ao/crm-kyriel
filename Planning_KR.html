.cal-toolbar{background:#fff;border-bottom:1px solid #ddd;padding:7px 14px;display:flex;gap:10px;align-items:center;flex-shrink:0;}

.cal-wrap{flex:1;overflow:auto;padding:12px;}
.cal-grid{display:grid;border:1px solid #ddd;border-radius:7px;overflow:hidden;background:#ddd;gap:1px;}
.cal-hdr{background:#1D9E75;color:#fff;text-align:center;padding:5px 2px;font-size:10px;font-weight:600;}

.charge-bar{height:20px;background:#eee;border-radius:3px;overflow:hidden;position:relative;margin-top:2px;}

<script>

const CLIENT_ID='a14d6f8e-d723-42de-b1c6-e5892e092157',TENANT_ID='b361cb3e-b7d9-4ea0-84c7-ccc513daffd6',SITE_NAME='CRMKyrielAO';
const AUTHORITY='https://login.microsoftonline.com/'+TENANT_ID;
const SCOPES=['https://hmsarl.sharepoint.com/.default'];
let msalApp=null,currentAccount=null,accessToken=null;

async function initMSAL(){
  msalApp=new msal.PublicClientApplication({
    auth:{clientId:CLIENT_ID,authority:AUTHORITY,redirectUri:'https://kyriel-ao.github.io/crm-kyriel/'+window.location.pathname.split('/').pop()},
    cache:{cacheLocation:'sessionStorage'}
  });
  await msalApp.initialize();
  const resp=await msalApp.handleRedirectPromise();
  if(resp)currentAccount=resp.account;
  const accs=msalApp.getAllAccounts();
  if(accs.length>0&&!currentAccount)currentAccount=accs[0];
}

async function login(){
  try{const r=await msalApp.loginPopup({scopes:SCOPES});currentAccount=r.account;accessToken=r.accessToken;return true;}
  catch(e){console.error(e);return false;}
}

async function getToken(){
  if(!currentAccount)return null;
  try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:currentAccount});accessToken=r.accessToken;return accessToken;}
  catch(e){try{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});accessToken=r.accessToken;return accessToken;}catch(e2){return null;}}
}

async function getDigest(token){
  const r=await fetch('https://hmsarl.sharepoint.com/sites/'+SITE_NAME+'/_api/contextinfo',{
    method:'POST',headers:{'Authorization':'Bearer '+token,'Accept':'application/json;odata=verbose'}
  });
  const d=await r.json();return d.d.GetContextWebInformation.FormDigestValue;
}

async function spFetch(path,method='GET',body=null){
  const token=await getToken();if(!token)throw new Error('Non authentifié');
  const url='https://hmsarl.sharepoint.com/sites/'+SITE_NAME+'/_api/'+path;
  const h={'Authorization':'Bearer '+token,'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose'};
  if(method!=='GET')h['X-RequestDigest']=await getDigest(token);
  const opts={method,headers:h};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok)throw new Error('SP '+r.status+': '+await r.text());
  const txt=await r.text();return txt?JSON.parse(txt):null;
}

async function spGetList(listName){
  const d=await spFetch("lists/getbytitle('"+listName+"')/items?$top=5000&$orderby=Created%20desc");
  return d.d.results;
}

async function spAddItem(listName,fields){
  const meta={type:'SP.Data.'+listName+'ListItem'};
  return await spFetch("lists/getbytitle('"+listName+"')/items",'POST',{__metadata:meta,...fields});
}

async function spUpdateItem(listName,itemId,fields){
  const token=await getToken();
  const meta={type:'SP.Data.'+listName+'ListItem'};
  await fetch('https://hmsarl.sharepoint.com/sites/'+SITE_NAME+'/_api/lists/getbytitle(\''+listName+'\''+')/items('+itemId+')',{
    method:'POST',
    headers:{'Authorization':'Bearer '+token,'Accept':'application/json;odata=verbose',
      'Content-Type':'application/json;odata=verbose','X-RequestDigest':await getDigest(token),
      'X-HTTP-Method':'MERGE','If-Match':'*'},
    body:JSON.stringify({__metadata:meta,...fields})
  });
}

async function spDeleteItem(listName,itemId){
  const token=await getToken();
  await fetch('https://hmsarl.sharepoint.com/sites/'+SITE_NAME+'/_api/lists/getbytitle(\''+listName+'\''+')/items('+itemId+')',{
    method:'POST',
    headers:{'Authorization':'Bearer '+token,'X-RequestDigest':await getDigest(token),'X-HTTP-Method':'DELETE','If-Match':'*'}
  });
}

async function ensureColumns(listName,columns){
  const token=await getToken();
  for(const col of columns){
    try{
      await spFetch("lists/getbytitle('"+listName+"')/fields",'POST',{
        __metadata:{type:'SP.Field'},Title:col.name,FieldTypeKind:col.type||2,Required:false
      });
    }catch(e){}
  }
}

function logout(){msalApp.logoutPopup();location.reload();}


const LIST_NAME='Planning_KR';
const PLANNING_COLS=[{"name": "Entite", "type": 2}, {"name": "PubPriv", "type": 2}, {"name": "TypeMOA", "type": 2}, {"name": "TypeProjet", "type": 2}, {"name": "Env", "type": 2}, {"name": "Lot", "type": 2}, {"name": "Client", "type": 2}, {"name": "NomOperation", "type": 2}, {"name": "Ville", "type": 2}, {"name": "Departement", "type": 2}, {"name": "Region", "type": 2}, {"name": "DateRemise", "type": 4}, {"name": "ChargeAffaire", "type": 2}, {"name": "Metreur", "type": 2}, {"name": "Statut", "type": 2}, {"name": "MontantEstime", "type": 9}, {"name": "Note", "type": 3}];
const MOIS=['','Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const HAS_TABS=false;
const DEFAULT_ENTITY='KR';
const ENTITY_COLOR='#D85A30';

let calYear=new Date().getFullYear(),calMonth=new Date().getMonth()+1;
let allData=[],editId=null,currentEntity=DEFAULT_ENTITY;

window.addEventListener('load',async()=>{
  await initMSAL();
  if(msalApp.getAllAccounts().length>0){currentAccount=msalApp.getAllAccounts()[0];showMain();}
});
async function doLogin(){const ok=await login();if(ok)showMain();else showToast('Erreur connexion','error');}

async function showMain(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('main-screen').style.display='flex';
  document.getElementById('user-name').textContent=currentAccount?.name||currentAccount?.username||'';
  await ensureColumns(LIST_NAME,PLANNING_COLS);
  await loadData();
}

async function loadData(){
  try{
    const items=await spGetList(LIST_NAME);
    allData=items.map(r=>{
      const d=r.DateRemise?new Date(r.DateRemise):null;
      return{id:r.Id,sp:true,Entite:r.Entite||DEFAULT_ENTITY,
        PubPriv:r.PubPriv||'',TypeMOA:r.TypeMOA||'',TypeProjet:r.TypeProjet||'',
        Env:r.Env||'',Lot:r.Lot||'',Client:r.Client||'',NomOperation:r.NomOperation||'',
        Ville:r.Ville||'',Departement:r.Departement||'',ChargeAffaire:r.ChargeAffaire||'',
        Metreur:r.Metreur||'',Statut:r.Statut||'',MontantEstime:+r.MontantEstime||0,
        Note:r.Note||'',DateRemise:r.DateRemise||'',
        day:d?d.getDate():0,month:d?d.getMonth()+1:0,year:d?d.getFullYear():0};
    });
    renderCal();
  }catch(e){console.error(e);allData=[];renderCal();showToast('Erreur chargement','error');}
}

function switchEntity(ent,btn){
  currentEntity=ent;
  document.querySelectorAll('.etab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const fe=document.getElementById('f-entite-cal');
  if(fe)fe.value=ent;
  renderCal();
}

function calNav(d){calMonth+=d;if(calMonth>12){calMonth=1;calYear++;}if(calMonth<1){calMonth=12;calYear--;}renderCal();}
function calToday(){calYear=new Date().getFullYear();calMonth=new Date().getMonth()+1;renderCal();}

function renderCal(){
  const entFilter=HAS_TABS?(document.getElementById('f-entite-cal')?.value||currentEntity):currentEntity;
  const dim=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  const todDay=(today.getFullYear()===calYear&&today.getMonth()+1===calMonth)?today.getDate():0;
  document.getElementById('cal-month').textContent=MOIS[calMonth]+' '+calYear;

  const filtered=allData.filter(r=>(!entFilter||r.Entite===entFilter)&&r.year===calYear&&r.month===calMonth);
  const byDay={};for(let d=1;d<=dim;d++)byDay[d]=[];
  filtered.forEach(r=>{if(r.day)byDay[r.day].push(r);});
  document.getElementById('cal-count').textContent=filtered.length+' AO ce mois';

  const maxC=Math.max(1,...Object.values(byDay).map(a=>a.length));
  let html='<div class="cal-grid" style="grid-template-columns:90px repeat('+dim+',1fr);">';

  // En-tête
  html+='<div class="cal-hdr" style="background:#f5f5f0;color:#555;text-align:left;padding-left:8px;">Entité</div>';
  for(let d=1;d<=dim;d++){
    const dow=new Date(calYear,calMonth-1,d).getDay();
    const isWE=dow===0||dow===6,isTod=d===todDay;
    html+=`<div class="cal-hdr${isWE?' we':''}${isTod?' tod':''}"><div style="font-weight:600">${d}</div><div style="font-size:8px;opacity:.8">${JOURS[dow]}</div></div>`;
  }

  // Ligne AO
  html+=`<div class="cal-entity-lbl">${entFilter||'Tous'}</div>`;
  for(let d=1;d<=dim;d++){
    const dow=new Date(calYear,calMonth-1,d).getDay();
    const isWE=dow===0||dow===6,isTod=d===todDay;
    const aos=byDay[d]||[];
    html+=`<div class="cal-cell${isWE?' we':''}${isTod?' tod':''}">`;
    aos.forEach(ao=>{
      const cls='ao-chip '+(ao.PubPriv==='PUB'?'ao-pub':'ao-priv');
      const ri=JSON.stringify(ao).replace(/"/g,'&quot;');
      html+=`<div class="${cls}" onmouseenter="showTip(event,${ri})" onmouseleave="hideTip()" ondblclick="openModal(${ri})">${ao.Ville||ao.Client||ao.NomOperation||'—'}</div>`;
    });
    html+='</div>';
  }

  // Barre de charge
  html+='<div class="cal-entity-lbl" style="font-size:10px;color:#888;border-left-color:#ccc;">Charge</div>';
  for(let d=1;d<=dim;d++){
    const n=(byDay[d]||[]).length;
    const pct=Math.round(n/maxC*100);
    const isTod=d===todDay;
    const col=n>=3?'#C0392B':n>=2?'#BA7517':ENTITY_COLOR;
    html+=`<div class="cal-cell" style="padding:4px 3px;">`;
    if(n)html+=`<div class="charge-bar"><div class="charge-fill" style="width:${pct}%;background:${isTod?'#1D9E75':col};opacity:.7;"></div><span class="charge-num">${n}</span></div>`;
    html+='</div>';
  }
  html+='</div>';

  // Résumé mensuel
  const nPUB=filtered.filter(r=>r.PubPriv==='PUB').length;
  html+=`<div style="margin-top:10px;background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px 14px;display:flex;gap:20px;font-size:12px;">
    <span>Total ce mois : <b>${filtered.length}</b></span>
    <span style="color:#185FA5;">Public : <b>${nPUB}</b></span>
    <span style="color:#D85A30;">Privé : <b>${filtered.length-nPUB}</b></span>
    <span>MEX : <b>${filtered.filter(r=>r.Lot&&r.Lot.includes('MEX')).length}</b></span>
    <span>MIN : <b>${filtered.filter(r=>r.Lot&&r.Lot.includes('MIN')&&!r.Lot.includes('MEX')).length}</b></span>
  </div>`;
  document.getElementById('cal-grid').innerHTML=html;
}

function showTip(e,r){
  const t=document.getElementById('tip');
  t.innerHTML=`<strong>${r.Client||r.NomOperation}</strong>${r.NomOperation}<br>${r.PubPriv} · ${r.Lot} · Dép.${r.Departement}<br>CA: ${r.ChargeAffaire||'—'} / Métreur: ${r.Metreur||'—'}<br>Statut: ${r.Statut}${r.MontantEstime?'<br>Montant: '+Math.round(r.MontantEstime/1000)+'K€':''}`;
  t.style.display='block';
  t.style.left=Math.min(e.clientX+12,window.innerWidth-320)+'px';
  t.style.top=Math.max(e.clientY-90,8)+'px';
}
function hideTip(){document.getElementById('tip').style.display='none';}

function openModal(r){
  editId=r?.id||null;
  document.getElementById('modal-title').textContent=editId?'Modifier l\'AO':'Nouvel AO';
  const g=id=>document.getElementById(id);
  if(HAS_TABS&&g('f-ENT'))g('f-ENT').value=r?.Entite||currentEntity;
  g('f-PP').value=r?.PubPriv||'PUB';
  g('f-MOA').value=r?.TypeMOA||'PROMOTEUR';
  g('f-TPROJ').value=r?.TypeProjet||'LOGT';
  g('f-ENV').value=r?.Env||'Neuf';
  g('f-LOT').value=r?.Lot||'MEX';
  g('f-DATE').value=r?.DateRemise?r.DateRemise.slice(0,10):'';
  g('f-CLIENT').value=r?.Client||'';
  g('f-NOM').value=r?.NomOperation||'';
  g('f-VILLE').value=r?.Ville||'';
  g('f-DEP').value=r?.Departement||'';
  g('f-CA').value=r?.ChargeAffaire||'';
  g('f-MET').value=r?.Metreur||'';
  g('f-HT').value=r?.MontantEstime||'';
  g('f-STAT').value=r?.Statut||'En cours';
  g('f-NOTE').value=r?.Note||'';
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');editId=null;}

async function saveItem(){
  const g=id=>document.getElementById(id).value;
  const dateVal=g('f-DATE');
  const fields={
    Entite:HAS_TABS?g('f-ENT'):DEFAULT_ENTITY,
    PubPriv:g('f-PP'),TypeMOA:g('f-MOA'),TypeProjet:g('f-TPROJ'),Env:g('f-ENV'),
    Lot:g('f-LOT'),DateRemise:dateVal?new Date(dateVal).toISOString():null,
    Client:g('f-CLIENT'),NomOperation:g('f-NOM'),Ville:g('f-VILLE'),
    Departement:g('f-DEP'),ChargeAffaire:g('f-CA'),Metreur:g('f-MET'),
    MontantEstime:+g('f-HT')||0,Statut:g('f-STAT'),Note:g('f-NOTE'),
  };
  try{
    if(editId){await spUpdateItem(LIST_NAME,editId,fields);showToast('AO mis à jour ✓','success');}
    else{await spAddItem(LIST_NAME,fields);showToast('AO ajouté ✓','success');}
    closeModal();await loadData();
  }catch(e){showToast('Erreur: '+e.message,'error');}
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;
  setTimeout(()=>t.className='toast',3000);
}
</script>
</body>
</html>
